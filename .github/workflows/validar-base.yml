name: Verificar base TutorALEPA
on:
  push:
    paths:
      - 'data/**'
      - 'tests/**'
      - 'tutoralepa.py'
      - '.github/workflows/validar-base.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'tests/**'
      - 'tutoralepa.py'
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar dados
        run: python tutoralepa.py validar
      - name: Executar testes
        run: python -m unittest discover -s tests -v
